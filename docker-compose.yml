## 所有环境变量都从同目录下的 .env 文件读取。
## 没配置的变量会使用这里的默认值（通常是空 / false），对运行没有副作用。
##
## 启动方式：
##   SQLite（默认）:         docker compose up -d
##   MySQL（内置容器）:      docker compose --profile mysql up -d
##   PostgreSQL（内置容器）: docker compose --profile postgres up -d
##   加上 WebDAV（dufs）:    追加 --profile webdav，例如:
##                           docker compose --profile mysql --profile webdav up -d
##
## 不带 --profile 时，只启动 gemini-chat 本身（不会启动数据库 / dufs 容器）。

services:
  gemini-chat:
    build:
      context: .
      dockerfile: Dockerfile
    image: bohesocool/gemini-chat:latest
    container_name: gemini-chat
    ports:
      - "5173:8080"
    restart: unless-stopped
    environment:
      # 登录密码（可选，不设置则使用默认密码 adminiadmin）
      - VITE_AUTH_PASSWORD=${VITE_AUTH_PASSWORD:-}

      # 运行环境（production / development）
      - NODE_ENV=${NODE_ENV:-production}

      ## === 数据库配置 ===
      # DB_ENABLED=true 时启用服务端数据库，否则走浏览器 IndexedDB
      - DB_ENABLED=${DB_ENABLED:-false}
      # 数据库类型：sqlite / mysql / postgresql
      - DB_TYPE=${DB_TYPE:-sqlite}
      # 数据库连接字符串（SQLite 可留空走默认 file:/app/data/gemini-chat.db）
      - SQL_DSN=${SQL_DSN:-}

      ## === WebDAV 同步配置 ===
      - WEBDAV_ENABLED=${WEBDAV_ENABLED:-false}
      - WEBDAV_URL=${WEBDAV_URL:-}
      - WEBDAV_USER=${WEBDAV_USER:-}
      - WEBDAV_PASSWORD=${WEBDAV_PASSWORD:-}
      # 推荐用 Docker secrets 存储密码，把密码写入文件，这里指向路径
      - WEBDAV_PASSWORD_FILE=${WEBDAV_PASSWORD_FILE:-}
      # 自动同步间隔，秒
      - WEBDAV_SYNC_INTERVAL=${WEBDAV_SYNC_INTERVAL:-300}
      # 备份加密密钥（可选）；不配则备份为明文
      - WEBDAV_ENCRYPTION_KEY=${WEBDAV_ENCRYPTION_KEY:-}
      - WEBDAV_ENCRYPTION_KEY_FILE=${WEBDAV_ENCRYPTION_KEY_FILE:-}

      ## === 后端安全配置 ===
      # JWT 签名密钥；不设置则每次重启生成临时密钥（所有旧 token 失效）
      - JWT_SECRET=${JWT_SECRET:-}
      - JWT_SECRET_FILE=${JWT_SECRET_FILE:-}
      # 服务端配置加密密钥：对数据库里存的 WebDAV 密码做 AES-GCM 加密
      - CONFIG_ENCRYPTION_KEY=${CONFIG_ENCRYPTION_KEY:-}
      - CONFIG_ENCRYPTION_KEY_FILE=${CONFIG_ENCRYPTION_KEY_FILE:-}
      # 允许的前端来源，逗号分隔；留空表示允许所有来源
      - CORS_ORIGINS=${CORS_ORIGINS:-}
    volumes:
      - chat_data:/app/data
    # secrets:
    #   - webdav_password
    #   - webdav_encryption_key
    #   - jwt_secret

  ## === MySQL（按需启动：docker compose --profile mysql up -d） ===
  mysql:
    profiles: ["mysql"]
    image: mysql:8.0
    container_name: gemini-chat-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gemini-chat}
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  ## === PostgreSQL（按需启动：docker compose --profile postgres up -d） ===
  postgres:
    profiles: ["postgres"]
    image: postgres:16-alpine
    container_name: gemini-chat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      POSTGRES_DB: ${POSTGRES_DB:-gemini-chat}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-root} -d ${POSTGRES_DB:-gemini-chat}"]
      interval: 10s
      timeout: 5s
      retries: 5

  ## === WebDAV 对端（dufs）按需启动：docker compose --profile webdav up -d ===
  ## 仅用于测试/本地，不建议在生产启用。
  ## 账号密码默认 admin / secret，可通过 .env 的 DUFS_AUTH 自定义：
  ##   DUFS_AUTH=myuser:mypass@/:rw
  dufs:
    profiles: ["webdav"]
    image: sigoden/dufs
    container_name: gemini-chat-dufs
    restart: unless-stopped
    ports:
      - "${DUFS_PORT:-5000}:5000"
    volumes:
      - dufs_data:/data
    command:
      - /data
      - --auth
      - ${DUFS_AUTH:-admin:secret@/:rw}
      - --allow-all

volumes:
  chat_data:
  mysql_data:
  postgres_data:
  dufs_data:

## === Docker secrets（取消注释后，把明文凭据替换为指向 secrets 文件路径） ===
